# Healthcare Eligibility Pipeline Configuration
# This file defines how to process each partner's data

partners:
  acme_health:
    partner_code: "ACME"
    file_path: "data/acme.txt"
    delimiter: "|"
    date_format: "%m/%d/%Y"
    column_mapping:
      external_id: "MBI"
      first_name: "FNAME"
      last_name: "LNAME"
      dob: "DOB"
      email: "EMAIL"
      phone: "PHONE"
  
  better_care:
    partner_code: "BCARE"
    file_path: "data/bettercare.csv"
    delimiter: ","
    date_format: "%Y-%m-%d"
    column_mapping:
      external_id: "subscriber_id"
      first_name: "first_name"
      last_name: "last_name"
      dob: "date_of_birth"
      email: "email"
      phone: "phone"

